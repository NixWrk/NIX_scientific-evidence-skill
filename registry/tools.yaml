schema_version: 1
updated: 2026-08-03

execution_policy:
  corpus_external_llm_api: forbidden
  allowed_runners:
    - current_codex_agent
    - local_llm
  network_during_corpus_run: forbidden
  portable_skill_format: SKILL.md

fixed_components:
  - id: zotero-mcp
    role: corpus_access
    status: available
    inputs:
      - zotero_collection
    outputs:
      - metadata
      - html_fulltext
      - pdf_pages
      - notes
      - annotations
    test_focus:
      - stable_item_keys
      - html_structure
      - source_provenance

candidates:
  - id: direct-zotero-html
    category: baseline
    status: environment_ready
    tasks: [qa, literature_review, manuscript]
    role: direct_context_processing

  - id: evidence-first-agent
    category: baseline
    status: smoke_tested
    tasks: [qa, literature_review, manuscript]
    role: structured_extraction_then_generation
    implementation: skills/scientific-evidence-workflow
    experiments: [EXP-0021, EXP-0022, EXP-0023]
    current_agent_smoke: passed
    paired_literature_review: pass_for_auditability_no_demonstrated_accuracy_gain_nonblind
    russian_scientific_style_regression: passed_without_evidence_drift
    local_model_execution: pending

  - id: russian-scientific-style-audit
    category: tool
    status: smoke_tested
    tasks: [qa, literature_review, manuscript]
    role: heuristic_russian_output_language_gate
    implementation: skills/scientific-evidence-workflow/scripts/audit_russian_style.py
    dependencies: python_standard_library_only
    experiment: EXP-0023
    limitations:
      - surface_patterns_only
      - clean_result_does_not_establish_linguistic_or_scientific_quality
      - generalization_and_local_model_run_pending

  - id: grobid
    category: tool
    status: not_started
    tasks: [qa, literature_review, manuscript]
    role: pdf_fallback_parser

  - id: academic-writing-skills
    category: portable_skill
    status: benchmarked
    tasks: [manuscript]
    role: writing_and_audit

  - id: literature-triage-matrix
    category: portable_skill
    status: smoke_tested
    tasks: [literature_review]
    role: cross_paper_evidence_matrix

  - id: sciwrite-lint
    category: tool
    status: not_started
    tasks: [qa, literature_review, manuscript]
    role: output_audit

status_values:
  - not_started
  - environment_ready
  - smoke_tested
  - benchmarked
  - rejected
  - blocked
