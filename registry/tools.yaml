schema_version: 1
updated: 2026-07-30

execution_policy:
  corpus_external_llm_api: forbidden
  allowed_runners:
    - current_codex_agent
    - local_llm
  network_during_corpus_run: forbidden
  portable_skill_format: SKILL.md

fixed_components:
  - id: zotero-mcp
    role: corpus_access
    status: available
    inputs:
      - zotero_collection
    outputs:
      - metadata
      - html_fulltext
      - pdf_pages
      - notes
      - annotations
    test_focus:
      - stable_item_keys
      - html_structure
      - source_provenance

candidates:
  - id: direct-zotero-html
    category: baseline
    status: environment_ready
    tasks: [qa, literature_review, manuscript]
    role: direct_context_processing

  - id: evidence-first-agent
    category: baseline
    status: not_started
    tasks: [qa, literature_review, manuscript]
    role: structured_extraction_then_generation

  - id: grobid
    category: tool
    status: not_started
    tasks: [qa, literature_review, manuscript]
    role: pdf_fallback_parser

  - id: academic-writing-skills
    category: portable_skill
    status: smoke_tested
    tasks: [manuscript]
    role: writing_and_audit

  - id: literature-triage-matrix
    category: portable_skill
    status: smoke_tested
    tasks: [literature_review]
    role: cross_paper_evidence_matrix

  - id: sciwrite-lint
    category: tool
    status: not_started
    tasks: [qa, literature_review, manuscript]
    role: output_audit

status_values:
  - not_started
  - environment_ready
  - smoke_tested
  - benchmarked
  - rejected
  - blocked
