    notes: >-
      Карточка построена до наступления условия и требований к работе не
      устанавливает, пока автор не подтвердит, что исследование с участием
      человека проводится. Разобраны область применения, принципы GCP,
      этические аспекты, менеджмент риска и управление данными; разделы 9 и 10
      об ответственности сторон остались неразобранными и названы в карточке.
    acquisition: carded

