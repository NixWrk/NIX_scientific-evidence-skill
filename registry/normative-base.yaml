documents:

  # --- tier 1: federal law -------------------------------------------------

  - id: PP-842
    title: Положение о присуждении учёных степеней
    authority: Постановление Правительства РФ от 24.09.2013 № 842
    tier: 1
    edition: "18.07.2026"
    status: in_force
    source: https://www.consultant.ru/document/cons_doc_LAW_152458/
    scope: [требования к диссертации, требования к публикациям, процедура защиты, состав совета]
    rules_to_extract:
      - критерии, которым должна отвечать диссертация
      - минимальное число публикаций с основными результатами
      - условия приравнивания результатов интеллектуальной деятельности к публикациям
    notes: >-
      По вопросам самой диссертации и процедуры защиты имеет приоритет над
      оформительскими стандартами. Для технических наук минимум публикаций —
      не менее двух; повышенный минимум в три установлен для перечисленных
      гуманитарных и общественных отраслей и к 2.2.12 не относится. Проверка
      числа публикаций недостаточна: издание должно удовлетворять требованиям
      к рецензируемым научным изданиям.
    acquisition: obtained

