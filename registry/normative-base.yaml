schema_version: 1
updated: 2026-08-14
design_document: docs/normative-base.md

target:
  specialty: "2.2.12"
  specialty_title: Приборы, системы и изделия медицинского назначения
  organization: МГТУ им. Н. Э. Баумана
  council: "24.2.331.09"

# Designations, editions, and current status were established by the user on
# 2026-08-14 against the official registries named in each `source`. This file
# records pointers and priority, not requirements: a rule is established only
# after a normative-pattern-analysis card is built from the file itself, with
# its hash and its explicitly unobserved parts. Nothing here may be treated as
# an extracted requirement.
provenance:
  designations_verified_by: user
  designations_verified_on: 2026-08-14
  requirements_extracted: partial
  carding_status: >-
    Разбор идёт по одному документу. Закартировано одиннадцать документов:
    PP-842, PASSPORT-2.2.12, VAK-EDITIONS, BMSTU-DISS-REQ, GOST-R-7.0.11-2011,
    GOST-R-7.0.5-2008, GOST-R-7.0.100-2018, GOST-7.32-2017, GOST-8.417-2024
    двумя карточками, GOST-R-ISO-14155-2022 и EXAMPLE-SATANENKO-2026 как
    образец практики совета. Стандарт структуры
    закрывает состав частей диссертации и автореферата, которого не
    устанавливал ни один другой документ базы; стандарты ссылки и описания
    закрывают библиографический аппарат с двух разных сторон и в один набор
    правил не сливаются. Требования остальных документов не установлены, но
    тексты получены, поэтому препятствие только в объёме разбора.
  example_rule: >-
    Карточка образца несёт только силу observed_practice и ничего не
    устанавливает. Это проверяется программой: попытка записать в карточку
    седьмого уровня обязательное требование отвергается, потому что иначе
    практика предшественника превратилась бы в норму.

# Lower tier wins. The order is the point of this file: it is what lets a
# conflict be resolved without argument.
priority_tiers:
  1: federal_law
  2: specialty_passport
  3: council_local
  4: dissertation_structure_standard
  5: formatting_standard
  6: medical_device_standard
  7: defended_example

conflict_resolution:
  - Меньший номер уровня побеждает.
  - Образец защищённой работы никогда не переопределяет действующий норматив.
  - Один образец показывает практику этого образца, а не правило совета.
  - ГОСТ 7.32-2017 применяется только там, где на него ссылается документ совета.
  - Область ГОСТ Р 7.0.5-2008 и область ГОСТ Р 7.0.100-2018 различны и не сливаются в один набор правил.
  - Объём автореферата берётся из требований совета, а не из числа страниц в образце.

acquisition_states: [needed, located, obtained, carded]

# Отложенное. Не блокеры и не забытое: каждая запись называет условие, при
# котором работа понадобится. Пока условие не наступило, отсутствие карточки
# не является пробелом — но и требования соответствующего документа не
# считаются установленными.
deferred:
  - id: GOST-ISO-14971-2021
    trigger: предмет работы — медицинское изделие, для которого ведётся менеджмент риска
  - id: GOST-IEC-60601-1-2024
    trigger: разработка медицинского электрического изделия
    note: применяется деревом, а не одной проверкой; частные стандарты серии определяются по виду изделия
  - id: BMSTU-DS-24.2.331.09
    trigger: оформление оборота обложки автореферата, где нужны реквизиты совета
  - id: BMSTU-LIB-DISS
    trigger: подготовка материалов к сдаче в библиотеку
  - id: BMSTU-ETHICS
    trigger: эксперимент с участием людей
    note: >-
      публично не найдено; правило пока такое — устанавливается организация, на
      базе которой эксперимент выполнялся, и её локальный комитет
  - id: EXAMPLE-SEMCHUK-2022
    trigger: >-
      потребуется отличить устойчивый шаблон совета от особенностей одной
      работы; по одному образцу Сатаненко это невозможно
  - id: EXAMPLE-MANSUROV-2023
    trigger: то же, плюс проверка правил приравнивания патентов к публикациям
  - id: ZOTERO-HERT-LUNG-GENERATIONS
    trigger: написание обзорной главы и разбор отчётов РФФИ как образцов отчётности

# Files live outside the repository. Standards and institutional materials carry
# their own terms of use, so only hashes are committed. `holding.kind` says what
# was actually obtained, which is not always the document itself:
#   document        — the text that carries the requirements
#   catalogue_card  — the registry entry: designation, status, dates. Not the text.
#   index_page      — a listing that points at documents
local_store:
  path: corpus/private/normative
  committed: false
  gitignored_by: "corpus/private/"

# `located` means the official source is identified, not that the file is held.
# Only `obtained` and `carded` involve an actual file.
retrieval_attempts:
  - date: 2026-08-14
    agent: claude-code-session
    outcome: failed
    reachable: [example.com]
    refused: [protect.gost.ru, uchsov.bmstu.ru, mf.bmstu.ru, rospatent.gov.ru, consultant.ru]
    diagnosis: >-
      Сеть доступна, но перечисленные хосты отказывают в соединении, что
      выглядит как фильтрация по расположению клиента. Файлы не получены.
    structural_limitation: >-
      Даже при доступности хоста инструмент выборки страниц возвращает пересказ
      содержимого моделью, а не исходные байты. Карточка норматива требует хеша
      файла, поэтому этот путь не может дать пригодную карточку ни при каких
      условиях. Файлы должен получить пользователь.
    next_action: пользователь помещает файлы в corpus/private/normative/

  - date: 2026-08-14
    agent: claude-code-session
    outcome: partial
    change: пользователь снял ограничение на российские хосты
    obtained: 47
    refused: [uchsov.bmstu.ru, vak.gisnauka.ru]
    diagnosis: >-
      Имя uchsov.bmstu.ru разрешается в hoster.bmstu.ru, но соединение не
      устанавливается; vak.gisnauka.ru не отвечает. Остальные хосты доступны.
    verified: >-
      Каждый файл проверен по сигнатуре и по содержимому: обозначение стандарта
      в карточке, ожидаемый текст в документе организации, заголовок PDF. Хеш
      страницы-заглушки в реестр не попал.
    still_missing:
      - текст стандартов: карточки Росстандарта не содержат содержания
      - BMSTU-DISS-REQ страница Учёного совета
      - VAK-EDITIONS перечень изданий
      - EXAMPLE-SATANENKO-2026 не найден поиском по библиотеке

  - date: 2026-08-14
    agent: claude-code-session
    outcome: partial
    change: повторная проверка отказавших узлов
    obtained: 6
    diagnosis: >-
      Узел uchsov.bmstu.ru отвечает по http, но не по https. Шесть страниц
      Учёного совета получены по незащищённому протоколу; это отмечено в
      holdings. Узел vak.gisnauka.ru не отвечает ни по одному протоколу.
    verified: >-
      Страница требований сверена с файлом DOCX по шести требованиям — совпали
      все. Побайтового сравнения не проводилось: страница является частью
      файла, который сводит четыре страницы совета. Состав совета 24.2.331.09
      подтверждён на странице состава вместе со специальностью 2.2.12.
    still_missing:
      - текст восьми стандартов
      - PASSPORT-2.2.12 и VAK-EDITIONS: узел ВАК не отвечает
      - BMSTU-ETHICS: публично не найдено
      - EXAMPLE-SATANENKO-2026: прямая ссылка неизвестна
      - ZOTERO-HERT-LUNG-GENERATIONS: сервер Zotero не подключён
      - ROSPATENT-SOFTWARE и ROSPATENT-INVENTION: не выгружались

documents:

  # --- tier 1: federal law -------------------------------------------------

  - id: PP-842
    title: Положение о присуждении учёных степеней
    authority: Постановление Правительства РФ от 24.09.2013 № 842
    tier: 1
    edition: "18.07.2026"
    status: in_force
    source: https://www.consultant.ru/document/cons_doc_LAW_152458/
    scope: [требования к диссертации, требования к публикациям, процедура защиты, состав совета]
    rules_to_extract:
      - критерии, которым должна отвечать диссертация
      - минимальное число публикаций с основными результатами
      - условия приравнивания результатов интеллектуальной деятельности к публикациям
    notes: >-
      По вопросам самой диссертации и процедуры защиты имеет приоритет над
      оформительскими стандартами. Для технических наук минимум публикаций —
      не менее двух; повышенный минимум в три установлен для перечисленных
      гуманитарных и общественных отраслей и к 2.2.12 не относится. Проверка
      числа публикаций недостаточна: издание должно удовлетворять требованиям
      к рецензируемым научным изданиям.
    acquisition: carded

  # --- tier 2: specialty passport ------------------------------------------

  - id: PASSPORT-2.2.12
    title: Паспорт научной специальности 2.2.12
    authority: ВАК
