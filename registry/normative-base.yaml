schema_version: 1
updated: 2026-08-14
design_document: docs/normative-base.md

target:
  specialty: "2.2.12"
  specialty_title: Приборы, системы и изделия медицинского назначения
  organization: МГТУ им. Н. Э. Баумана
  council: "24.2.331.09"

# Designations, editions, and current status were established by the user on
# 2026-08-14 against the official registries named in each `source`. This file
# records pointers and priority, not requirements: a rule is established only
# after a normative-pattern-analysis card is built from the file itself, with
# its hash and its explicitly unobserved parts. Nothing here may be treated as
# an extracted requirement.
provenance:
  designations_verified_by: user
  designations_verified_on: 2026-08-14
  requirements_extracted: false
  blocking_gap: normative-pattern-analysis genre is reserved, not implemented

# Lower tier wins. The order is the point of this file: it is what lets a
# conflict be resolved without argument.
priority_tiers:
  1: federal_law
  2: specialty_passport
  3: council_local
  4: dissertation_structure_standard
  5: formatting_standard
  6: medical_device_standard
  7: defended_example

conflict_resolution:
  - Меньший номер уровня побеждает.
  - Образец защищённой работы никогда не переопределяет действующий норматив.
  - Один образец показывает практику этого образца, а не правило совета.
  - ГОСТ 7.32-2017 применяется только там, где на него ссылается документ совета.
  - Область ГОСТ Р 7.0.5-2008 и область ГОСТ Р 7.0.100-2018 различны и не сливаются в один набор правил.
  - Объём автореферата берётся из требований совета, а не из числа страниц в образце.

acquisition_states: [needed, located, obtained, carded]

